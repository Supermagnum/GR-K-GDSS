# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Keep GitHub Actions current when workflows are added under .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Same for the long-lived GNU Radio 4 port branch
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "gnuradio4"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
